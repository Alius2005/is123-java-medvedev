# Переопределяем настройки БД только для тестов
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=LEGACY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Отключаем выполнение schema.sql в тестах — Hibernate сам создаст таблицы
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# Отключаем специфичные для Firebird вещи если они есть
app.db-type=h2