<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CinemaHome — Сегодня в прокате</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
    <header>
        <h1>CinemaHome</h1>
        <nav>
            <a href="/movies">Фильмы</a>
            <a href="/series">Сериалы</a>
            <a href="/genres">Жанры</a>
            <a href="/actors">Актёры</a>
            <a href="/login" class="btn-login">Войти</a>
        </nav>
    </header>
    <main class="hero">
        <div class="pick-card" th:if="${movie}">
            <img src="https://picsum.photos/seed/movie/400/600" alt="Постер" class="poster">
            <div class="info">
                <h2 th:text="${movie.title}">Название</h2>
                <p class="mood" th:text="'Настроение: ' + ${movie.moodTag}" th:classappend="${movie.moodTag}">Настроение</p>
                <p class="desc" th:text="${movie.description}">Описание</p>
                <a th:href="@{/player/movie/{id}(id=${movie.id})}" class="btn-primary">Смотреть</a>
            </div>
        </div>
        <div class="empty" th:unless="${movie}">
            <h2>Фильмов пока нет</h2>
            <p>Зайдите в <a href="/admin/movies">панель админа</a> и добавьте что-нибудь!</p>
        </div>

        <!-- БЛОК: выбор что добавить -->
        <div style="margin-top: 2rem; background: var(--card); border: 1px solid #e5e5e5; padding: 1.5rem;">
            <h3 style="margin-top: 0;">Панель управления контентом</h3>

            <div style="display: flex; gap: 1rem; align-items: center;">
                <label for="addType" style="font-weight: 500;">Добавить:</label>
                <select id="addType" name="type" style="padding: .75rem; border: 1px solid #ccc; background: #fafafa; font: inherit; min-width: 200px;">
                    <option value="movie">Фильм</option>
                    <option value="series">Сериал</option>
                    <option value="genre">Жанр</option>
                    <option value="actor">Актер</option>
                    <option value="director">Режиссер</option>
                </select>
                <button type="button" class="btn-primary" onclick="goToAddPage()">Перейти</button>
            </div>

            <p style="color:#777; font-size:0.9rem; margin-top:1rem; margin-bottom: 0;">
                Для доступа ко всем разделам нужно войти как модератор или админ.
            </p>
        </div>
    </main>
</div>
<script>
    function goToAddPage() {
        const type = document.getElementById('addType').value;
        switch(type) {
            case 'movie':
                window.location.href = '/admin/movies';
                break;
            case 'series':
                window.location.href = '/admin/series';
                break;
            case 'genre':
                window.location.href = '/admin/genres';
                break;
            case 'actor':
                window.location.href = '/admin/actors';
                break;
            case 'director':
                window.location.href = '/admin/directors';
                break;
            default:
                window.location.href = '/admin/movies';
        }
    }
</script>
</body>
</html>
