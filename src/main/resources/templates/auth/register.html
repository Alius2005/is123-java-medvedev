<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация — CinemaHome</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container narrow">
    <header><h1>Регистрация</h1></header>
    <form th:action="@{/register}" method="post" class="form-card">
        <input name="username" placeholder="Имя пользователя" required>
        <input name="password" type="password" placeholder="Пароль" required>
        <button type="submit" class="btn-primary">Создать аккаунт</button>
        <p>Уже есть аккаунт? <a href="/login">Войти</a></p>
    </form>
</div>
</body>
</html>
