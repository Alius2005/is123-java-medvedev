<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Серии: ' + ${series.title}">Серии</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <header>
        <h1 th:text="${series.title}">Сериал</h1>
        <nav>
            <a href="/">Главная</a>
            <a href="/series">Все сериалы</a>
        </nav>
    </header>
    <main>
        <h2>Выберите серию</h2>

        <div th:if="${#lists.isEmpty(episodes)}">
            <p>Для этого сериала пока нет серий.</p>
        </div>

        <ul th:if="${!#lists.isEmpty(episodes)}" style="list-style: none; padding: 0; margin: 0;">
            <li th:each="e : ${episodes}" style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 0; border-bottom: 1px solid #e5e5e5;">
                <span th:text="${e.episodeNumber} + ' серия — ' + ${e.title}" style="flex: 1; margin-right: 1rem;">1 серия</span>
                <a th:href="@{/player/series/{id}(id=${e.id})}" class="btn-primary" style="white-space: nowrap; margin-left: 1rem;">
                    ▶ Смотреть
                </a>
            </li>
        </ul>
    </main>
</div>
</body>
</html>
