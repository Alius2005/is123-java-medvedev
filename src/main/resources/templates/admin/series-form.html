<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Админ — Добавить сериал</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container narrow">
    <header>
        <h1>Панель админа</h1>
        <nav>
            <a href="/">Главная</a>
            <a href="/movies">Фильмы</a>
            <a href="/admin/movies">Админ: фильмы</a>
        </nav>
    </header>

    <main>
        <div sec:authorize="hasRole('MODERATOR') or hasRole('ADMIN')">
            <h2>Добавить сериал</h2>
            <form th:action="@{/admin/series}" method="post" class="form-card">
                <input name="title" placeholder="Название сериала" required>
                <textarea name="description" placeholder="Описание" rows="4"></textarea>

                <!-- путь к файлу (папке/плейлисту) сериала -->
                <input name="filePath" placeholder="Путь к файлам сериала, напр. /home/video/series" required>

                <button type="submit" class="btn-primary">Сохранить</button>
            </form>
        </div>
    </main>
</div>
</body>
</html>
