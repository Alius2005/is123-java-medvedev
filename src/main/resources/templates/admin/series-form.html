<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Админ — Добавить сериал</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container narrow">
    <header>
        <h1>Панель админа</h1>
        <nav>
            <a href="/">Главная</a>
            <a href="/admin/movies">Фильмы</a>
            <a href="/admin/series">Сериалы</a>
            <a href="/admin/genres">Жанры</a>
            <a href="/admin/actors">Актеры</a>
            <a href="/admin/directors">Режиссеры</a>
        </nav>
    </header>

    <main>
        <div sec:authorize="hasRole('MODERATOR') or hasRole('ADMIN')">
            <h2>Добавить сериал</h2>
            <form th:action="@{/admin/series}" method="post" class="form-card">
                <input name="title" placeholder="Название сериала" required>
                <textarea name="description" placeholder="Описание" rows="4"></textarea>

                <!-- корневая папка, напр. жуки -->
                <input name="folder" placeholder="home/student/videos/ваш сериал" required>

                <!-- номер сезона -->
                <input name="seasonNumber" type="number" min="1" placeholder="Номер сезона, напр. 4" required>

                <!-- КОЛИЧЕСТВО СЕРИЙ -->
                <input name="episodesCount" type="number" min="1" placeholder="Количество серий, напр. 10" required>

                <button type="submit" class="btn-primary">Сохранить</button>
            </form>
        </div>
    </main>
</div>
</body>
</html>
