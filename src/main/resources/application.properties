# -------------------------------------------------
# App DB Type (for your own sanity)
# -------------------------------------------------
app.db-type=firebird

# -------------------------------------------------
# Spring DataSource + Flyway (the real deal)
# -------------------------------------------------
spring.datasource.url=jdbc:firebirdsql://localhost:3051/./cinema.fdb?encoding=UTF8&lc_ctype=UTF8
spring.datasource.username=SYSDBA
spring.datasource.password=masterkey
spring.datasource.driver-class-name=org.firebirdsql.jdbc.FBDriver

#flyway.url=${spring.datasource.url}
#flyway.user=sysdba
#flyway.password=masterkey
#flyway.driver-class-name=org.firebirdsql.jdbc.FBDriver
#flyway.enabled=true

# -------------------------------------------------
# JPA / Hibernate (no more jpa. nonsense)
# -------------------------------------------------
spring.jpa.database-platform=org.hibernate.community.dialect.FirebirdDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# -------------------------------------------------
# Devtools? Nah. Logging? Maybe later.
# -------------------------------------------------
# spring.devtools.add-properties=false
logging.level.org.springframework.web=DEBUG
logging.level.org.thymeleaf=DEBUG